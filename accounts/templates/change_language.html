{% extends "themes/v1/base.html" %}

{% block content %}
<div class="container-fluid">
	<div class="row mt-1">
		<div class="col">
			{% if messages %}
			<ul class="messages">
				{% for message in messages %}
				<li
					{% if message.tags %}
					    class="alert alert-{{ message.tags }}"
					{% endif %}
				>
					{{ message }}
				</li>
				{% endfor %}
			</ul>
			{% endif %}
		</div>
	</div>


    <div class="row justify-content-center">
        <div class="col-12 col-md-10  col-lg-8 col-xl-6">
            <form method="post" class="change-lang-form">
                {% csrf_token %}

                <div class="row m-0">
                    <div class="col text-center">
                        <h4 class="title">Change Language</h4>
                    </div>
                </div>

                <div class="body">
                    <select name="language" class="mt-3 form-select" required>
                        <!-- TODO: use options from prismic -->
                        <option value="" disabled selected>-- Select language --</option>
                        <option value="en-us">English</option>
                        <option value="id-id">Bahasa Indonesia</option>
                        <option value="qm-zh">中文</option>
                    </select>
                    
                    <div class="btn-warpper m-3 mt-4 text-center">
                        <button 
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .content {
        background: #eaedf6;
        padding-top: 30px;
        form {
            border-radius: 20px;
            background: #eaedf6;

            .title {
                font-size: 1.5rem;
                color: #3565ff;
            }
            .body {
                padding: 1rem 2rem;
            }

            .form-label {
                font-size: 1rem;
            }
            .form-select {
                background: #eaedf6;
                background: white;
                color: #191970;
                border: 1px solid #dbd8d8;
                border-radius: 10px;
                font-size: 1rem;
                min-height: 45px;
                box-shadow: none;
                &:focus {
                    box-shadow: none;
                    border-color: #3565ff;
                }
            }
            select option[disabled],
            select:invalid,
            .empty-select {
                color: gray !important;
                font-style: italic;
            }

            button {
                background-color: #3565ff !important;
                color: white;
                border-radius: 20px;
                padding: 7px 20px;
                font-size: 1rem;
                border: none;
                min-width: 60%;
                min-height: 45px;
                &:hover {
                    background-color: #191970;
                }
            }
        }
    }
</style>
{% endblock %}
