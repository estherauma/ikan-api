{% extends 'themes/v1/auth-base.html' %}
<!-- {% load static %} -->

{% block content %}
<div
    id="select-language-modal"
    class="modal show fade mt-5"
    data-bs-backdrop="static"
    data-bs-keyboard="false"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    style="display:block;"
>
    <div class="modal-dialog">
        <form method="post" class="modal-content">
            {% csrf_token %}

            <div class="modal-header row m-0">
                <div class="col text-center">
                    {% include 'themes/v1/partials/ikan-logo.html' %}
                    <h4 class="modal-title">Select Your Language</h4>
                </div>
            </div>

            <div class="modal-body">
                <select name="language" class="mt-3 form-select" required>
                    <!-- TODO: use options from prismic -->
                    <option value="" disabled selected>-- Select language --</option>
                    <option value="en-us">English</option>
                    <option value="id-id">Bahasa Indonesia</option>
                    <option value="qm-zh">中文</option>
                </select>
                
                <div class="btn-warpper m-3 mt-4 text-center">
                    <button 
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<style>
    .logo-container {
        padding: 10px;
        margin: 0 auto 10px auto;
        img {
            height: 18px;
        }
    }
    #select-language-modal {
        /* background: rgba(53,101,255,0.5) !important; */
        form {
            border-radius: 20px;
            border: 0.1px solid #191970;
            /* background: white; */
            background: #eaedf6;

            .modal-title {
                font-size: 1.3rem;
                color: #3565ff;
            }
            .modal-body {
                padding: 1rem 2rem;
            }

            .form-label {
                font-size: 1rem;
            }
            .form-select {
                background: #eaedf6;
                background: white;
                color: #191970;
                border: 1px solid #dbd8d8;
                border-radius: 10px;
                font-size: 1rem;
                min-height: 45px;
                box-shadow: none;
                &:focus {
                    box-shadow: none;
                    border-color: #3565ff;
                }
            }
            select option[disabled],
            select:invalid,
            .empty-select {
                color: gray !important;
                font-style: italic;
            }

            button {
                background-color: #3565ff !important;
                color: white;
                border-radius: 20px;
                padding: 7px 20px;
                font-size: 1rem;
                border: none;
                min-width: 60%;
                min-height: 45px;
                &:hover {
                    background-color: #191970;
                }
            }
        }
    }
</style>
{% endblock %}
