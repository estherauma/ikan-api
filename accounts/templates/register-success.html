            <div class="card bg-pattern">
                <div class="card-body p-4 text-center">
                    <div class="text-center m-auto">
                        {% include 'themes/v1/partials/ikan-logo.html' %}
                    </div>
                    
                    <h1 class="mb-3 mt-3 ikan-primary-color">{{ reg_success_page_text.registrationSuccess }}</h1>

<style>

        text-decoration: underline;

    }
    .link {
        text-decoration: none !important;
        padding: 10px 20px !important;
    }
    p {
        font-size: 1.1rem;
        color: #191970;
    }
    .card {
        border-radius: 20px;
