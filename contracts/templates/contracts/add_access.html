{% extends 'themes/v1/base.html' %}
{% load static %}
{% load custom_filters %}

{% block content %}
<div class="container-fluid">
    <div class="row"></div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-header bg-light text-dark">
                    <h5 class="card-title">Add User to view contract</h5>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit">{{ common_text.submit }}</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
{% endblock %}
