<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8" />
        <title>{% block title %}Log In | IKAN{% endblock %}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta content="IKAN" name="description" />
        <meta content="FiftyEight" name="author" />

        <!-- App favicon -->
        <link rel="shortcut icon" href="/static/themes/v1/assets/images/favicon.ico">

		<!-- Theme Config Js -->
		<script src="/static/themes/v1/assets/js/head.js"></script>

		<!-- Bootstrap css -->
		<link href="/static/themes/v1/assets/css/bootstrap.min.css" rel="stylesheet" type="text/css" id="app-style" />

		<!-- App css -->
		<!-- <link href="/static/themes/v1/assets/css/app.min.css" rel="stylesheet" type="text/css" /> -->
		<link href="/static/themes/v1/assets/css/auth.css" rel="stylesheet" type="text/css" />

		<!-- Icons css -->
		<link href="/static/themes/v1/assets/css/icons.min.css" rel="stylesheet" type="text/css" />

        <!-- intlTelInput JS Dependencies -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/css/intlTelInput.css">
        <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/js/intlTelInput.min.js"></script>

    </head>

    <body class="{% block body_class %}authentication-bg authentication-bg-pattern{% endblock %}">
       
       {% block content %} {% endblock %}

        <footer class="footer footer-alt  text-center ikan-dark-blue-100">
            <script>document.write(new Date().getFullYear())  </script>
            <a
                class="ikan-primary-color"
                style="margin-left: 10px;"
                href="https://fiftyeight.io/"
                target="_blank"
            >
                FiftyEight
            </a>
        </footer>
        
        <!-- Jquery -->
        <script src="https://code.jquery.com/jquery-3.7.0.min.js" integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>
        <!-- Authentication js -->
        <script src="/static/themes/v1/assets/js/pages/authentication.init.js"></script>

    </body>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const submitButton = document.querySelector('button[type="submit"]');
            const formEl = document.querySelector('form');
            const defaultBtnText = "{{ common_text.submit | default:'Submit' }}";
            const submittingText = "{{ common_text.submittingYourData | default:'Submitting your data...' }}";
            const resetButton = () => {
                submitButton.disabled = false;
                submitButton.innerText = defaultBtnText;
            }

            // Reset submit button on fresh page load or browser back/forward navigation
            resetButton();
            window.addEventListener("pageshow", (e) => {
                if (e.persisted) resetButton();
            });

            /* 
                Handle phone number inputs using the intl-tel-input library.
                It initializes the library for each input, adjusts the UI based on whether the input is an email or a phone number,
                and converts local phone numbers to E.164 format before form submission.
            */
            // Query all phone number inputs on a given form
            const phoneNumberInputs = document.querySelectorAll(".ikan-phonenumber-input");
            phoneNumberInputs.forEach((input) => {
                // Initialize intl-tel-input each field
                const iti = window.intlTelInput(input, {
                    utilsScript: "https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/js/utils.js",
                    initialCountry: "auto",
                    geoIpLookup: callback => {
                        fetch("https://ipapi.co/json")
                        .then(res => res.json())
                        .then(data => callback(data.country_code))
                        .catch(() => callback("us"));
                    }
                });

                // Toggle field UI based on whether the input is an email or a phone number
                const adjustUI = () => {
                    const value = input.value.trim();
                    const isEmail = value.includes("@") || /[a-zA-Z]/.test(value);
                    const container = input.closest(".iti");

                    if (container) {
                        if (isEmail || !value) {
                            container.classList.add("iti-disabled-style");
                        } else {
                            container.classList.remove("iti-disabled-style");
                        }
                    }
                }

                // Runs on initial load (handles pre-filled values in edit forms)
                adjustUI();

                // Runs on every keypress inside this specific input
                input.addEventListener("input", adjustUI);
                
                // Dynamically create and insert error span
                const showError = (message) => {
                    clearError(); // Avoid duplicate spans if clicked multiple times

                    const errorSpan = document.createElement("span");
                    errorSpan.className = "dynamic-phone-error";
                    errorSpan.style.color = "#dc3545";
                    errorSpan.style.fontSize = "0.875rem";
                    errorSpan.style.marginTop = "6px";
                    errorSpan.style.display = "block";
                    errorSpan.textContent = message;

                    // Target .iti wrapper created by intl-tel-input
                    const itiContainer = input.closest(".iti") || input;
                    
                    // Insert immediately after the input container
                    itiContainer.parentNode.insertBefore(errorSpan, itiContainer.nextSibling);
                };

                // Remove the dynamically created error span
                const clearError = () => {
                    const existingError = document.querySelector(".dynamic-phone-error");
                    if (existingError) {
                        existingError.remove();
                    }
                };

                // Clear dynamic error as soon as user edits input
                input.addEventListener("input", clearError);

                formEl.addEventListener("submit", (e) => {
                    clearError();

                    const rawValue = input.value.trim();
                    const isEmail = rawValue.includes("@") || /[a-zA-Z]/.test(rawValue);

                    // Skip validation if it's an email'
                    if (isEmail || rawValue === "") return;

                    const countryData = iti.getSelectedCountryData();
                    const formattedNumber = iti.getNumber();

                    // Check if country code is missing or number is invalid
                    if (!countryData.dialCode || !formattedNumber.startsWith("+") || !iti.isValidNumber()) {
                        e.preventDefault(); // Stop submission
                        const err_msg = "{{ auth_common_text.invalidPhoneNumber | default:'Please select a valid country code and enter a complete phone number.' }}"
                        showError(err_msg);
                        
                        // DO NOT DISABLE: Keep button active on error
                        resetButton();
                        return;
                    }

                    // Reformat input to E.164 before submitting
                    input.value = formattedNumber;

                    // Disable submit button to prevent multiple submissions
                    // Use setTimeout so the form payload captures the input value before disabling
                    setTimeout(() => {
                        submitButton.disabled = true;
                        submitButton.innerText = submittingText;
                    }, 10);
                });
            });
        });
    </script>
    
    <style>
        .ikan-primary-color {
            color: #3565ff;
        }
        .ikan-dark-blue-100 {
            color: #191970 !important;
        }
        .ikan-dark-blue-90 {
            color: #263CB1 !important;
        }
        .ikan-blue-100 {
            color: #3565FF !important;
        }
        .ikan-blue-90 {
            color: #5799FF !important;
        }
        .ikan-light-blue-100 {
            color: #80D8FE !important;
        }
        .ikan-light-blue-90 {
            color: #C0EFFF !important;
        }
        .ikan-gray-100 {
            color: #EAEDF6 !important;
        }
        .ikan-light-gray {
            color: #D3DAEE !important;
        }
        .ikan-deep-gray {
            color: #A0ABCC !important;
        }
        .ikan-skyblue-100 {
            color: #EAEDF6 !important;
        }
        .ikan-green-100 {
            color: #74F080 !important;
        }
        .ikan-red-100 {
            color: #F0525C !important;
        }
        .ikan-yellow-100 {
            color: #F4992D !important;
        }
        .ikan-primary-color-bg-100 {
            background-color: #3565ff !important;
        }
        .ikan-primary-button {
            background-color: #3565ff;
            color: white;
            border-radius: 20px;
            padding: 7px 20px;
            font-size: 1rem;
            border: none;
            &:hover,
            &:focus,
            &:active {
                background-color: #191970;
            }
        }
        .ikan-form {
            .form-label,
            label {
                font-weight: 300;
                font-size: 1.1rem;
                color: #3565ff;
            }
            .form-control {
                background: white;
                color: #191970;
                border: 1px solid rgba(25, 25, 112, 0.3);
                border-radius: 10px;
                font-size: 1rem;
                min-height: 45px;
                box-shadow: none;
                &:focus {
                    box-shadow: none;
                    border-color: #3565ff;
                }
                &::placeholder {
                    color: black;
                    opacity: 0.35;
                }
            }
            select option[disabled],
            select:invalid,
            .empty-select {
                color: gray !important;
                font-style: italic;
            }
        }
        
        .authentication-bg {
            background: rgba(234, 237, 246, 0.5);
        }
        footer {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-size: 1rem;
        }



        /* Hides the country dropdown UI when rendering an email */
        .iti-disabled-style .iti__flag-container {
            display: none;
        }
        .iti-disabled-style input {
            padding-left: 0.9rem !important;
        }
        .iti {
            width: 100%;
        }
    </style>

</html>
