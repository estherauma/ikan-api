<!-- Check EOF for usage -->
<div class="modal fade" id="ikan-pdf-modal" tabindex="-1" aria-labelledby="ikan-pdf-modal-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content">
      <div class="modal-header row m-0">
        <div class="col col-10 text-center">
            <!-- TODO: translate -->
            <h4 id="ikan-pdf-modal-title" class="modal-title ikan-dark-blue-100">PDF preview</h4>
        </div>
        <div class="col col-2 d-flex justify-content-end">
            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
            ></button>
        </div>
      </div>
      <div class="modal-body text-center">
        <embed 
          id="ikan-pdf-modal-embed" 
          src="" 
          type="application/pdf" 
          width="100%" 
          height="600px"
          style="border: none; border-radius: 4px;"
        >
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const pdfLinks = document.querySelectorAll('[data-bs-toggle="pdf-modal"]');
    const pdfEmbed = document.getElementById("ikan-pdf-modal-embed");
    const modalTitle = document.getElementById("ikan-pdf-modal-title");
    const pdfModal = new bootstrap.Modal(document.getElementById("ikan-pdf-modal"));

    document.addEventListener("click", (e) => {
      const link = e.target.closest('[data-bs-toggle="pdf-modal"]');
      console.log("Clicked link:", link);
      if (!link) return;

      const pdfUrl = link.getAttribute("data-pdf-src");
      const title = link.getAttribute("data-pdf-title");

      modalTitle.textContent = title || "PDF Preview";
      pdfEmbed.src = pdfUrl;

      pdfModal.show();
    });

    // Clear PDF when modal closes
    const pdfModalEl = document.getElementById("ikan-pdf-modal");
    pdfModalEl?.addEventListener("hidden.bs.modal", () => {
      // if (pdfEmbed.src.startsWith("blob:")) {
      //   URL.revokeObjectURL(pdfEmbed.src);
      // }

      pdfEmbed.src = "";
    });
});
</script>


<!-- USAGE -->

  Example:

    href="#"
    data-bs-toggle="pdf-modal"
