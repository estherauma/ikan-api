        <!-- App js -->
        <script src="/static/themes/v1/assets/js/app.min.js"></script>

        {% block scripts %} {% endblock %}
        
        <!-- Common scripts -->
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                // query all select elements with class 'ikan-select'

                const selects = document.querySelectorAll('.ikan-select');
                // const selects = document.querySelectorAll('select');
                selects.forEach(select => {
                    // USE EMPTY SELECT OPTION AS A PLACEHOLDER
                    function updatePlaceholder() {
                        if (!select.value) {
                            select.classList.add('empty-select');
                            select.style.color = 'red';
                        } else {
                            select.classList.remove('empty-select');
                            select.style.color = '';
                        }
                    }

                    // Initial check
                    updatePlaceholder();
                    // Update on change
                    select.addEventListener('change', updatePlaceholder);

                    // Disable first option if it has no value, as it's used as a placeholder
                    if (select.options.length > 0 && !select.options[0].value) {
                        select.options[0].disabled = true;
                    }


                    // ADD DROPDOWN ICON TO IKAN SELECT
                    const icon = document.createElement('i');
                    icon.className = 'bi bi-chevron-down';
                    icon.style.position = 'absolute';
                    icon.style.right = '10px';
                    icon.style.top = '75%';
                    icon.style.transform = 'translateY(-50%)';
                    icon.style.pointerEvents = 'none'; // Prevents the icon from blocking clicks on the select element
                    icon.style.fontWeight = 'bold';
                    icon.style.opacity = '0.5';
                    select.style.position = 'relative';
                    select.parentNode.style.position = 'relative';
                    select.parentNode.appendChild(icon);
                });
            });
        </script>

        <!-- Common styles -->
        <style>
            .ikan-primary-color {

            .ikan-form {

                }

                    background: #eaedf6;

                    border: none;

                    font-size: 1rem;
                    min-height: 45px;
                    box-shadow: none;
                    &:focus {

                        border-color: #3565ff;
                    }
                }
                select option[disabled],
                select:invalid,
                .empty-select {
                    color: gray !important;
                    font-style: italic;
                }
            }
            .ikan-modal {
                .modal-content {
                    border-radius: 20px;
                    border: 0.1px solid #191970;
                    background: white;

                    .modal-title {
                        font-size: 1.3rem;
                        color: #3565ff;
                    }
                }
            }
        </style>
